[package]
name = "vpt-control"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "VPT1 userspace controller: configuration, identities and Noise exchange"
license = "GPL-2.0-only"
publish = false

[[bin]]
name = "vptctl"
path = "src/main.rs"

[dependencies]
# Same BLAKE2 major line that snow 0.10.0 uses, so the fingerprint and the
# Noise hash come from one implementation.
blake2 = "0.10.6"
clap = { version = "4.6.7", features = ["derive"] }
curve25519-dalek = "4.1.3"
hex = "0.4.3"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
# Network summary JSON (`vptctl network`).
serde_json = "1"
# TECHNICAL_DESIGN.md section 3.1 pins this exact release; risky-raw-split
# is used once per attempt in exchange::split and nowhere else.
snow = { version = "=0.10.0", features = ["risky-raw-split"] }
subtle = "2.6.1"
thiserror = "2.0.21"
toml = "1.1.8"
zeroize = "1.9.1"

# Safe syscall wrappers for the Generic Netlink socket, so the crate keeps
# `unsafe_code = "forbid"`. Same version tempfile already locks.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["net", "time"] }

[dev-dependencies]
# Independent of snow's transport path: used to check Split direction
# against the upstream cacophony vector.
chacha20poly1305 = "=0.10.1"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

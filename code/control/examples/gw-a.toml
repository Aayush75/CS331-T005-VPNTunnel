# Sample Gateway A for the core fixture (TECHNICAL_DESIGN.md section 2).
# The public keys are sample values only; their private halves were discarded.
# Fixture runs generate fresh identities with `vptctl genkey`.

[gateway]
name = "gw-a"
private_key_file = "/etc/vpntunnel/gw-a.key"
lan_interface = "lan0"
lan_address = "10.77.1.1/24"
underlay_interface = "out0"
underlay_address = "172.31.250.11/24"

[[peer]]
name = "gw-b"
slot = 1
public_key = "ad8cbe47dec1eb6f5491880eb2612ef18d42b3c667c7b165c4047437fb86861f"
endpoint = "172.31.250.12"
role = "initiator"
path_mtu = 1500
prefixes = ["10.77.2.0/24"]

# Service policy: A -> B allowed; A2 -> B and B2 allowed; everything else denied.

[[rule]]
id = 1
peer = "gw-b"
source = "10.77.1.10/32"
destination = "10.77.2.10/32"
protocol = "tcp"
ports = "8080"

[[rule]]
id = 2
peer = "gw-b"
source = "10.77.1.11/32"
destination = "10.77.2.10/32"
protocol = "tcp"
ports = "8080"

[[rule]]
id = 3
peer = "gw-b"
source = "10.77.1.11/32"
destination = "10.77.2.11/32"
protocol = "tcp"
ports = "8080"
